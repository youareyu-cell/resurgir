<style>
/* =========================================================
   UI OPTIMIZED CSS
   ========================================================= */
:root {
  --bg-main: #050505;
  --bg-card: #111111;
  --bg-elevated: #1a1a1a;
  --border-color: rgba(255, 255, 255, 0.08);
  --text-main: #f5f5f5;
  --text-muted: #888888;
  --accent: #ffffff;
  --danger: #ff5555;
  --radius-card: 20px;
  --radius-btn: 12px;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: var(--bg-main);
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  overscroll-behavior-y: none; /* スワイプ時の余計なスクロールを防ぐ */
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
  transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s, opacity 0.2s;
}

button:active {
  transform: scale(0.96); /* タップ時の沈み込み */
}

/* --- Layout --- */
.app {
  max-width: 620px;
  min-height: 100vh;
  margin: auto;
  padding-bottom: 100px;
}

header {
  position: sticky;
  top: 0;
  z-index: 20;
  padding: 24px 20px 16px;
  background: rgba(5, 5, 5, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid transparent;
}

.logo {
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 4px;
  background: linear-gradient(135deg, #fff 0%, #aaa 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.sub {
  margin-top: 4px;
  color: var(--text-muted);
  font-size: 10px;
  letter-spacing: 2px;
  font-weight: 600;
}

/* --- Screen Transitions --- */
@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.screen {
  display: none;
  padding: 16px 20px 24px;
}

.screen.active {
  display: block;
  animation: fadeSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* --- Cards & Containers --- */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-card);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
}

.card h2 {
  margin: 0 0 16px;
  font-size: 13px;
  letter-spacing: 2.5px;
  color: var(--text-muted);
}

.muted { color: var(--text-muted); }

.quote {
  font-size: 24px;
  line-height: 1.4;
  font-weight: 900;
  text-align: center;
  padding: 10px 0;
}

/* --- Stats & Scores --- */
.score {
  font-size: 56px;
  line-height: 1;
  font-weight: 900;
  margin: 8px 0 4px;
  letter-spacing: -1px;
}

.rank {
  color: var(--accent);
  font-size: 12px;
  letter-spacing: 3px;
  font-weight: 700;
}

.progress {
  height: 6px;
  margin-top: 16px;
  background: var(--bg-elevated);
  border-radius: 99px;
  overflow: hidden;
}

.progress > div {
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}

.stat {
  background: var(--bg-elevated);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.stat-label {
  color: var(--text-muted);
  font-size: 10px;
  letter-spacing: 1.5px;
  font-weight: 600;
}

.stat-value {
  font-size: 24px;
  font-weight: 800;
  margin-top: 6px;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

/* --- Forms & Inputs --- */
label {
  display: block;
  color: var(--text-muted);
  font-size: 10px;
  letter-spacing: 1.5px;
  margin-bottom: 8px;
  font-weight: 600;
}

input {
  width: 100%;
  padding: 14px 16px;
  color: var(--text-main);
  background: var(--bg-elevated);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-btn);
  outline: none;
  font-size: 14px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

input:focus {
  border-color: #555;
  box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
}

input::placeholder {
  color: #555;
}

/* --- Custom Checkboxes --- */
.check {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--text-main);
  font-size: 13px;
  cursor: pointer;
  font-weight: 500;
}

.check input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;
  width: 22px;
  height: 22px;
  margin: 0;
  padding: 0;
  border: 2px solid #444;
  border-radius: 6px;
  background: var(--bg-main);
  position: relative;
  cursor: pointer;
  flex-shrink: 0;
}

.check input[type="checkbox"]:checked {
  background: var(--accent);
  border-color: var(--accent);
}

.check input[type="checkbox"]:checked::after {
  content: '';
  position: absolute;
  top: 45%;
  left: 50%;
  width: 5px;
  height: 10px;
  border: solid var(--bg-main);
  border-width: 0 2px 2px 0;
  transform: translate(-50%, -50%) rotate(45deg);
}

/* --- Buttons --- */
.btn {
  width: 100%;
  margin-top: 12px;
  padding: 16px;
  border: 0;
  border-radius: var(--radius-btn);
  background: var(--accent);
  color: var(--bg-main);
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 1px;
}

.btn.secondary {
  color: var(--text-main);
  background: var(--bg-elevated);
  border: 1px solid var(--border-color);
}

.btn.danger {
  color: var(--danger);
  background: rgba(255, 85, 85, 0.1);
  border: 1px solid rgba(255, 85, 85, 0.2);
}

.small-btn {
  padding: 8px 12px;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-elevated);
  color: var(--text-main);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
}

/* --- Lists & Exercises --- */
.list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.list-item {
  padding: 16px;
  border: 1px solid var(--border-color);
  border-radius: 16px;
  background: var(--bg-elevated);
}

.routine-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.routine-name {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 1px;
}

.exercise {
  padding: 16px;
  margin-top: 12px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-color);
  border-radius: 16px;
}

.exercise-title {
  font-weight: 700;
  font-size: 15px;
}

.exercise-meta {
  margin-top: 6px;
  color: var(--text-muted);
  font-size: 11px;
  letter-spacing: 0.5px;
}

.set-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-top: 12px;
}

.set-grid input {
  padding: 10px;
  font-size: 14px;
  text-align: center;
}

.badge {
  display: inline-block;
  padding: 4px 8px;
  border: 1px solid #444;
  border-radius: 6px;
  color: #ccc;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1px;
}

.empty {
  padding: 32px 16px;
  text-align: center;
  color: #666;
  font-size: 12px;
  line-height: 1.8;
  font-weight: 500;
}

/* --- Navigation --- */
.nav {
  position: fixed;
  z-index: 50;
  bottom: 0;
  left: 50%;
  width: min(620px, 100%);
  height: 80px;
  transform: translateX(-50%);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  background: rgba(10, 10, 10, 0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border-color);
  padding-bottom: env(safe-area-inset-bottom);
}

.nav button {
  border: 0;
  background: none;
  color: #666;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 1px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.nav button:active {
  transform: none; /* ナビボタンは沈み込ませない */
  opacity: 0.7;
}

.nav button.active {
  color: var(--accent);
  font-weight: 800;
}

.nav-icon {
  font-size: 20px;
  transition: transform 0.2s;
}

.nav button.active .nav-icon {
  transform: translateY(-2px);
}

/* --- Toast --- */
.toast {
  position: fixed;
  z-index: 100;
  bottom: 100px;
  left: 50%;
  padding: 12px 24px;
  border-radius: 99px;
  background: var(--text-main);
  color: var(--bg-main);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1px;
  transform: translate(-50%, 20px) scale(0.95);
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 8px 16px rgba(0,0,0,0.3);
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0) scale(1);
}

/* --- Modals --- */
@keyframes slideUpModal {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.modal {
  position: fixed;
  z-index: 80;
  inset: 0;
  display: none;
  align-items: flex-end;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

.modal.active {
  display: flex;
  animation: fadeIn 0.2s ease-out;
}

.modal.active .modal-box {
  animation: slideUpModal 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.modal-box {
  width: 100%;
  max-width: 620px;
  max-height: 90vh;
  margin: auto auto 0 auto; /* 下寄せ */
  padding: 24px;
  overflow: auto;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-bottom: none;
  border-radius: 24px 24px 0 0;
  box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
}

.modal-title {
  margin-bottom: 20px;
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 1px;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@media(min-width: 700px) {
  .modal {
    align-items: center;
  }
  .modal-box {
    margin: auto;
    border-radius: 24px;
    border-bottom: 1px solid var(--border-color);
  }
}
</style>
