function clone(obj){
  return JSON.parse(JSON.stringify(obj));
}

function esc(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function pad(n){
  return String(n).padStart(2,"0");
}

function dateKey(date=new Date()){
  return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;
}

function monthKey(date=new Date()){
  return `${date.getFullYear()}-${pad(date.getMonth()+1)}`;
}

function formatDate(key){
  const [y,m,d] = key.split("-");
  return `${y}/${m}/${d}`;
}

function save(){

}

function hashString(str){
  let h=0;
  for(let i=0;i<str.length;i++){
    h=((h<<5)-h)+str.charCodeAt(i);
    h|=0;
  }
  return Math.abs(h);
}

function daysAgo(date,n){

    missionDone:false,
    workout:false,
    body:false,
    wasteAmount:null,
    housework:{},
    fall:false
  };

  state.days[key]=d;
  save();
  return d;
}

function ensureToday(){
  let d=getDay();

  if(!d){
    d=createDay();
  }

  if(!d.missionId){
    d.missionId=pickMissionId();
  }

  if(!d.housework){
    d.housework={};
  }

  if(typeof d.missionDone!=="boolean"){
    d.missionDone=!!d.quest;
  }

  if(d.wasteAmount===undefined || d.wasteAmount===null){
    if(d.wealth===true){
      d.wasteAmount=0;
    }
  }

  save();
  return d;
}

function pickMissionId(){
  const recentKeys=Object.keys(state.days)
    .sort()
    .slice(-5);

  const recent=recentKeys
    .map(k=>state.days[k]?.missionId)
    .filter(Boolean);

  const available=MISSION_POOL.filter(m=>!recent.includes(m[0]));

  const pool=available.length ? available : MISSION_POOL;
  return pool[Math.floor(Math.random()*pool.length)][0];
}

function missionById(id){
  const found=MISSION_POOL.find(x=>x[0]===id);
  return found ? found[1] : "今日の任務を完遂する";
}

function getDailyCodes(key=dateKey()){
  const shuffled=DAILY_CODES
    .map(item=>({
      item,
      score:hashString(key+"-"+item.id)
    }))
    .sort((a,b)=>a.score-b.score);

  return shuffled.slice(0,3).map(x=>x.item);
}

function codeCount(d){
  if(!d || !d.code) return 0;
  return getDailyCodes(d.date)
    .filter(c=>d.code[c.id])
    .length;
}

function houseworkCount(d){
  if(!d || !d.housework) return 0;
  return HOUSE_TASKS.filter(x=>d.housework[x[0]]).length;
}

function houseworkScore(d){
  return houseworkCount(d)>=3 ? 10 : 0;
}

function wealthScore(d){
  return d &&
    d.wasteAmount!==null &&
    d.wasteAmount!==undefined &&
    Number(d.wasteAmount)===0
    ? 10
    : 0;
}

function dayScore(d){
  if(!d) return 0;

  const code=codeCount(d)*10;
  const workout=d.workout ? 25 : 0;
  const body=d.body ? 10 : 0;
  const wealth=wealthScore(d);
  const mission=d.missionDone ? 15 : 0;
  const house=houseworkScore(d);

  return code+workout+body+wealth+mission+house;
}

function isActiveDay(d){
  if(!d) return false;

  return (
    codeCount(d)>0 ||
    d.workout ||
    d.body ||
    d.missionDone ||
    d.wasteAmount!==null ||
    houseworkCount(d)>0
  );
}

function totalXP(){
  return Object.values(state.days)
    .reduce((sum,d)=>sum+dayScore(d),0);
}

function streak(){
  let count=0;

  for(let i=0;i<1000;i++){
    const d=getDay(dateKey(daysAgo(new Date(),i)));

    if(!isActiveDay(d)) break;

    count++;
  }

  return count;
}

function cleanDays(){
  let count=0;

  for(let i=0;i<30;i++){
    const key=dateKey(daysAgo(new Date(),i));
    const d=getDay(key);

    if(isActiveDay(d) && !d.fall){
      count++;
    }
  }

  return count;
}

function levelInfo(){
  const xp=totalXP();
  const level=Math.min(20,Math.floor(xp/250)+1);

  const ranks=[
    [1,"AWAKEN"],
    [2,"BUILT"],
    [3,"DISCIPLINED"],
    [5,"FORGED"],
    [8,"RESPECTED"],
    [12,"UNBREAKABLE"],
    [16,"RESURGIR"],
    [20,"LEGEND"]
  ];

  let rank="AWAKEN";

  ranks.forEach(r=>{
    if(level>=r[0]) rank=r[1];
  });

  const currentFloor=(level-1)*250;
  const progress=Math.min(100,((xp-currentFloor)/250)*100);

  return {
    level,
    rank,
    progress,
    xp
  };
}

function allDays(){
  return Object.values(state.days);
}

/* ---------- MANHOOD ---------- */

function manhoodScores(){
  const days=allDays();

  let missions=0;
  let active=0;
  let houseDays=0;
  let noWaste=0;
  let workouts=0;
  let bodies=0;
  let truth=0;
  let blame=0;
  let pause=0;
  let love=0;
  let codes=0;

  days.forEach(d=>{
    if(isActiveDay(d)) active++;
    if(d.missionDone) missions++;
    if(houseworkCount(d)>=3) houseDays++;
    if(wealthScore(d)>0) noWaste++;
    if(d.workout) workouts++;
    if(d.body) bodies++;

    if(d.code?.truth) truth++;
    if(d.code?.blame) blame++;
    if(d.code?.pause) pause++;
    if(d.code?.love) love++;

    codes+=codeCount(d);
  });

  return {
    COURAGE:Math.min(100,40+missions*4),
    DISCIPLINE:Math.min(100,30+active*2+codes),
    RESPONSIBILITY:Math.min(100,35+houseDays*3),
    RESPECT:Math.min(100,40+truth*3+blame*3),
    PRESENCE:Math.min(100,40+pause*3),
    LOVE:Math.min(100,40+love*4),
    WEALTH:Math.min(100,40+noWaste*2),
    BODY:Math.min(100,30+workouts*3+bodies)
  };
}

/* ---------- WEEK ---------- */

function mondayOf(date){
  const d=new Date(date);
  const day=d.getDay();
  const diff=(day+6)%7;
  d.setDate(d.getDate()-diff);
  return d;
}

function weekKey(date){
  return dateKey(mondayOf(date));
}

function reviewTargetKey(){
  const now=new Date();

  if(now.getDay()===0 && now.getHours()>=21){
    return weekKey(now);
  }

  const previous=new Date(mondayOf(now));
  previous.setDate(previous.getDate()-7);

  return dateKey(previous);
}

function reviewIsOpen(){
  const now=new Date();

  return now.getDay()===0 &&
    now.getHours()>=21 &&
    now.getHours()<=23;
}

function weekDates(key){
  const [y,m,d]=key.split("-").map(Number);
  const start=new Date(y,m-1,d);

  return Array.from({length:7},(_,i)=>{
    const x=new Date(start);
    x.setDate(start.getDate()+i);
    return dateKey(x);
  });
}

function weekStats(key){
  const dates=weekDates(key);
  const days=dates.map(k=>getDay(k)).filter(Boolean);

  const total=dates.reduce((s,k)=>s+dayScore(getDay(k)),0);

  return {
    average:Math.round(total/7),
    total,
    workouts:days.filter(d=>d.workout).length,
    missions:days.filter(d=>d.missionDone).length,
    noWaste:days.filter(d=>wealthScore(d)>0).length,
    housework:days.filter(d=>houseworkCount(d)>=3).length,
    falls:days.filter(d=>d.fall).length
  };
}

/* ---------- ACTIONS ---------- */

function toggleCode(id){
  const d=ensureToday();

  if(!d.code) d.code={};

  d.code[id]=!d.code[id];

  save();
  refresh(true);
}

function toggleMission(){
  const d=ensureToday();

  d.missionDone=!d.missionDone;

  save();
  refresh(true);

  toast(d.missionDone?"MISSION COMPLETE":"MISSION reopened");
}

function toggleHouse(id){
  const d=ensureToday();

  if(!d.housework){
    d.housework={};
  }

  d.housework[id]=!d.housework[id];

  save();
  refresh(true);
}

function resetData(){
  if(!confirm("RESURGIRの全データを削除します。よろしいですか？")) return;

  localStorage.removeItem(KEY);
  state=clone(DEFAULT_STATE);

  save();
  render();
}

/* ---------- MODAL ---------- */

function openModal(title,body){
  document.getElementById("modalRoot").innerHTML=`
    <div class="modal-bg" onclick="modalOutside(event)">
      <div class="modal-sheet">
        <div class="modal-head">
          <div class="modal-title">${title}</div>
          <button class="close" onclick="closeModal()">×</button>
        </div>

        ${body}
      </div>
    </div>
  `;
}

function modalOutside(e){
  if(e.target.classList.contains("modal-bg")){
    closeModal();
  }
}

function closeModal(){
  document.getElementById("modalRoot").innerHTML="";
}

/* ---------- INCOME MODAL ---------- */

function openIncomeModal(){
  openModal("ADD SIDE INCOME",`
    <div class="input-group">
      <label>AMOUNT / 金額</label>
      <input id="incomeAmount" class="input" type="number" min="0" placeholder="5000">
    </div>

    <div class="input-group">
      <label>NOTE / メモ</label>
      <input id="incomeNote" class="input" type="text" placeholder="cleaning">
    </div>

    <button class="btn full-btn" onclick="saveIncome()">
      ADD INCOME
    </button>

    <div class="rule">
      今月の副業収入として記録されます。
    </div>
  `);
}

function saveIncome(){
  const amount=Number(document.getElementById("incomeAmount")?.value||0);
  const note=document.getElementById("incomeNote")?.value||"";

  if(amount<=0){
    toast("金額を入力してください");
    return;
  }

  const key=monthKey();

  if(!state.sideIncomeByMonth[key]){
    state.sideIncomeByMonth[key]=[];
  }

  state.sideIncomeByMonth[key].push({
    id:Date.now(),
    date:dateKey(),
    amount,
    note
  });

  save();
  closeModal();
  refresh(true);
  toast("SIDE INCOME ADDED");
}

function saveWaste(){

function saveBody(){

/* ---------- WORKOUT ---------- */

function openWorkoutModal(routineId){
  const routine=state.routines.find(x=>x.id===routineId);

  if(!routine) return;

  openModal("START WORKOUT",`
    <div class="small">
      ${esc(routine.name)} / ${esc(routine.day)}
    </div>

    <div style="margin-top:16px;">
      ${routine.exercises.map((ex,i)=>`
        <div class="card" style="margin-bottom:10px;padding:15px;">
          <div style="font-size:12px;font-weight:800;margin-bottom:10px;">

                step="0.5"
                value="${ex.kg}"

            </div>

              <label>REPS</label>
              <input

          <div class="input-group" style="margin-top:10px;margin-bottom:0;">

    <button class="btn full-btn" onclick="saveWorkout('${routine.id}')">
      COMPLETE WORKOUT
    </button>
  `);

function saveWorkout(routineId){
  const routine=state.routines.find(x=>x.id===routineId);

  if(!routine) return;

  const exercises=routine.exercises.map((ex,i)=>({
    name:ex.name,
    kg:Number(document.getElementById("wkg"+i)?.value||ex.kg),
    reps:Number(document.getElementById("wreps"+i)?.value||ex.reps),
    sets:Number(document.getElementById("wsets"+i)?.value||ex.sets)
  }));

  state.trainingLogs.push({
    id:Date.now(),
    date:dateKey(),
    routineId,
    routineName:routine.name,
    exercises
  });

  const d=ensureToday();

  d.workout=true;
  d.body=true;

  save();
  closeModal();
  refresh(true);
  toast("WORKOUT COMPLETE");
}

/* ---------- TOAST ---------- */

function toast(message){
  const el=document.getElementById("toast");

  el.textContent=message;
  el.classList.add("show");

  clearTimeout(window.__toastTimer);

  window.__toastTimer=setTimeout(()=>{
    el.classList.remove("show");
  },1500);
}

/* ---------- LOAD / MIGRATION ---------- */

function loadState(){
  let raw=
    localStorage.getItem(KEY) ||
    localStorage.getItem("resurgir_v12") ||
    localStorage.getItem("resurgir_v11");

  if(!raw){
    return clone(DEFAULT_STATE);
  }

  try{
    const saved=JSON.parse(raw);

    const merged={
      ...clone(DEFAULT_STATE),
      ...saved
    };

    merged.version=13;

    if(!merged.days) merged.days={};
    if(!merged.routines?.length){
      merged.routines=clone(DEFAULT_ROUTINES);
    }

    if(!merged.trainingLogs) merged.trainingLogs=[];
    if(!merged.falls) merged.falls=[];
    if(!merged.weightLogs) merged.weightLogs=[];
    if(!merged.foodLogs) merged.foodLogs=[];
    if(!merged.sideIncomeByMonth) merged.sideIncomeByMonth={};
    if(!merged.weeklyReviews) merged.weeklyReviews={};
    if(!merged.journal) merged.journal=[];
    if(!merged.ui) merged.ui={screen:"HOME"};

    Object.values(merged.days).forEach(d=>{
      if(!d.code) d.code={};
      if(!d.housework) d.housework={};

      if(d.missionId===undefined){
        d.missionId=null;
      }

      if(d.missionDone===undefined){
        d.missionDone=!!d.quest;
      }

      if(d.wasteAmount===undefined){
        d.wasteAmount=
          d.wealth===true
          ? 0
          : null;
      }
    });

    return merged;

  }catch(e){
    return clone(DEFAULT_STATE);
  }
}
