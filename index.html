<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>RESURGIR</title>

<style>
:root{
  --bg-main:#050505;
  --bg-card:#111111;
  --bg-elevated:#1a1a1a;
  --border-color:rgba(255,255,255,.08);
  --text-main:#f5f5f5;
  --text-muted:#888;
  --accent:#fff;
  --danger:#ff5555;
  --success:#bdbdbd;
  --radius-card:20px;
  --radius-btn:12px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  background:var(--bg-main);
  min-height:100%;
  overflow-x:hidden;
}

body{
  margin:0;
  padding:0;
  background:var(--bg-main);
  color:var(--text-main);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",
    "Hiragino Kaku Gothic ProN","Hiragino Sans",Arial,sans-serif;
  overscroll-behavior-y:none;
  min-height:100vh;
  overflow-x:hidden;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:620px;
  min-height:100vh;
  margin:0 auto;

  /* FIX:
     fixed bottom nav + iPhone safe area + extra breathing room */
  padding-bottom:calc(112px + env(safe-area-inset-bottom));
}

.header{
  position:sticky;
  top:0;
  z-index:30;
  padding:calc(14px + env(safe-area-inset-top)) 18px 14px;
  background:rgba(5,5,5,.86);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.04);
}

.header-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:.14em;
  background:linear-gradient(90deg,#fff,#777);
  -webkit-background-clip:text;
  color:transparent;
}

.rank-mini{
  text-align:right;
}

.rank-mini .rank{
  font-size:11px;
  font-weight:800;
  letter-spacing:.16em;
}

.rank-mini .level{
  font-size:10px;
  color:var(--text-muted);
  margin-top:2px;
}

.screen{
  padding:18px;
  animation:fadeIn .18s ease;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.hero{
  padding:24px 2px 18px;
}

.eyebrow{
  font-size:10px;
  letter-spacing:.2em;
  color:#777;
  font-weight:800;
  margin-bottom:12px;
}

.hero-title{
  font-size:31px;
  line-height:1.02;
  font-weight:900;
  letter-spacing:-.035em;
}

.hero-sub{
  margin-top:10px;
  color:#888;
  font-size:12px;
  line-height:1.7;
}

.card{
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:var(--radius-card);
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.12);
}

.card-title-row{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  margin-bottom:14px;
}

.card-title{
  font-size:13px;
  font-weight:900;
  letter-spacing:.12em;
}

.card-ja{
  display:block;
  margin-top:4px;
  color:#666;
  font-size:9px;
  letter-spacing:.04em;
  font-weight:600;
}

.rule{
  color:#666;
  font-size:9px;
  line-height:1.65;
  margin-top:12px;
}

.score-wrap{
  text-align:center;
  padding:8px 0 3px;
}

.score{
  font-size:60px;
  line-height:1;
  font-weight:900;
  letter-spacing:-.06em;
}

.score-label{
  margin-top:7px;
  color:#777;
  font-size:9px;
  letter-spacing:.18em;
  font-weight:800;
}

.progress{
  width:100%;
  height:5px;
  background:#202020;
  border-radius:10px;
  overflow:hidden;
  margin-top:15px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#ddd;
  transition:width .3s ease;
}

.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat{
  background:#0c0c0c;
  border:1px solid rgba(255,255,255,.05);
  border-radius:15px;
  padding:15px;
}

.stat-value{
  font-size:24px;
  font-weight:900;
}

.stat-label{
  color:#666;
  font-size:9px;
  margin-top:4px;
  letter-spacing:.1em;
}

.btn{
  width:100%;
  min-height:46px;
  border-radius:var(--radius-btn);
  padding:12px 15px;
  font-weight:850;
  font-size:12px;
  letter-spacing:.04em;
  transition:.15s ease;
}

.btn:active{
  transform:scale(.98);
}

.btn-primary{
  background:#f3f3f3;
  color:#080808;
}

.btn-secondary{
  background:#1a1a1a;
  color:#eee;
  border:1px solid rgba(255,255,255,.08);
}

.btn-danger{
  background:#261010;
  color:#ff7777;
  border:1px solid rgba(255,80,80,.18);
}

.btn-small{
  width:auto;
  min-height:36px;
  padding:8px 12px;
  font-size:10px;
}

.stack{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.muted{
  color:var(--text-muted);
}

.tiny{
  font-size:9px;
  color:#666;
  line-height:1.6;
}

.divider{
  height:1px;
  background:rgba(255,255,255,.06);
  margin:15px 0;
}

input,
textarea,
select{
  width:100%;
  background:#090909;
  color:#eee;
  border:1px solid rgba(255,255,255,.09);
  border-radius:12px;
  padding:13px;
  outline:none;
}

textarea{
  min-height:90px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  border-color:rgba(255,255,255,.25);
}

.field{
  margin-bottom:10px;
}

.field-label{
  color:#777;
  font-size:9px;
  font-weight:800;
  letter-spacing:.12em;
  margin-bottom:6px;
}

.check-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.check-item{
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px;
  background:#0b0b0b;
  border:1px solid rgba(255,255,255,.05);
  border-radius:13px;
}

.check-toggle{
  width:21px;
  height:21px;
  flex:0 0 21px;
  appearance:none;
  -webkit-appearance:none;
  border:1px solid #555;
  border-radius:6px;
  background:#080808;
  position:relative;
  margin:0;
}

.check-toggle:checked{
  background:#eee;
  border-color:#eee;
}

.check-toggle:checked::after{
  content:"✓";
  position:absolute;
  color:#000;
  font-size:14px;
  font-weight:900;
  left:4px;
  top:0px;
}

.check-content{
  flex:1;
  min-width:0;
}

.check-main{
  font-size:11px;
  font-weight:750;
}

.check-sub{
  font-size:8px;
  color:#666;
  margin-top:3px;
}

.done{
  opacity:.45;
}

.mission-box{
  padding:18px;
  background:#0a0a0a;
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
}

.mission-tag{
  color:#666;
  font-size:9px;
  font-weight:900;
  letter-spacing:.16em;
  margin-bottom:9px;
}

.mission-title{
  font-size:19px;
  line-height:1.25;
  font-weight:900;
}

.mission-ja{
  color:#777;
  font-size:10px;
  line-height:1.6;
  margin-top:7px;
}

.mission-status{
  margin-top:13px;
  font-size:10px;
  font-weight:900;
  letter-spacing:.1em;
}

.status-done{
  color:#bbb;
}

.status-open{
  color:#eee;
}

.nav{
  position:fixed;
  z-index:50;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:100%;
  max-width:620px;

  padding:
    8px
    10px
    calc(9px + env(safe-area-inset-bottom));

  background:rgba(9,9,9,.91);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,.07);
}

.nav-inner{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
}

.nav-btn{
  min-height:48px;
  background:transparent;
  color:#555;
  border-radius:12px;
  font-size:8px;
  font-weight:850;
  letter-spacing:.07em;
}

.nav-btn.active{
  background:#181818;
  color:#eee;
}

.nav-ja{
  display:block;
  font-size:7px;
  color:inherit;
  opacity:.55;
  margin-top:3px;
}

.toast{
  position:fixed;
  z-index:100;
  left:50%;
  bottom:calc(88px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(15px);
  background:#eee;
  color:#080808;
  padding:10px 15px;
  border-radius:12px;
  font-size:10px;
  font-weight:850;
  opacity:0;
  pointer-events:none;
  transition:.2s ease;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.modal-backdrop{
  position:fixed;
  z-index:80;
  inset:0;
  background:rgba(0,0,0,.72);
  display:none;
  align-items:flex-end;
  justify-content:center;
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:620px;
  max-height:88vh;
  overflow-y:auto;
  background:#101010;
  border:1px solid rgba(255,255,255,.08);
  border-radius:22px 22px 0 0;
  padding:20px 18px calc(25px + env(safe-area-inset-bottom));
  box-shadow:0 -20px 60px rgba(0,0,0,.5);
}

.modal-title{
  font-size:18px;
  font-weight:900;
}

.modal-sub{
  color:#666;
  font-size:9px;
  margin-top:4px;
  margin-bottom:17px;
}

.exercise-row{
  padding:13px 0;
  border-bottom:1px solid rgba(255,255,255,.05);
}

.exercise-name{
  font-size:11px;
  font-weight:850;
  margin-bottom:8px;
}

.exercise-target{
  font-size:9px;
  color:#666;
  margin-bottom:8px;
}

.exercise-inputs{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
}

.section-heading{
  margin:22px 0 10px;
  font-size:11px;
  letter-spacing:.16em;
  font-weight:900;
}

.empty{
  color:#555;
  font-size:10px;
  padding:12px 0;
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:5px 8px;
  border-radius:8px;
  background:#1a1a1a;
  color:#888;
  font-size:8px;
  font-weight:900;
  letter-spacing:.1em;
}

.level-bar{
  height:4px;
  background:#222;
  border-radius:10px;
  overflow:hidden;
  margin-top:7px;
}

.level-fill{
  height:100%;
  background:#aaa;
}

.log-item{
  padding:13px 0;
  border-bottom:1px solid rgba(255,255,255,.05);
}

.log-item:last-child{
  border-bottom:0;
}

.log-title{
  font-size:11px;
  font-weight:800;
}

.log-meta{
  color:#666;
  font-size:9px;
  margin-top:4px;
  line-height:1.6;
}

.score-points{
  font-size:10px;
  color:#888;
  font-weight:900;
}

/* very small screens */
@media(max-width:360px){
  .screen{
    padding-left:14px;
    padding-right:14px;
  }

  .hero-title{
    font-size:27px;
  }

  .score{
    font-size:54px;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="header-row">
      <div class="logo">RESURGIR</div>
      <div class="rank-mini">
        <div class="rank" id="headerRank">AWAKEN</div>
        <div class="level" id="headerLevel">LV.1</div>
      </div>
    </div>
  </header>

  <main id="screen"></main>

</div>

<nav class="nav">
  <div class="nav-inner">
    <button class="nav-btn active" data-tab="HOME">
      HOME
      <span class="nav-ja">今日</span>
    </button>

    <button class="nav-btn" data-tab="BUILD">
      BUILD
      <span class="nav-ja">鍛える</span>
    </button>

    <button class="nav-btn" data-tab="CODE">
      CODE
      <span class="nav-ja">戒律</span>
    </button>

    <button class="nav-btn" data-tab="LOG">
      LOG
      <span class="nav-ja">戦績</span>
    </button>

    <button class="nav-btn" data-tab="MORE">
      MORE
      <span class="nav-ja">その他</span>
    </button>
  </div>
</nav>

<div id="modalBackdrop" class="modal-backdrop">
  <div id="modal" class="modal"></div>
</div>

<div id="toast" class="toast"></div>

<script>

   RESURGIR v13
   - Random Missions
   - No Weekly Boss
   - Monthly side-income reset
   - Wealth = wasteful spending control
   - Housework added
   - Fixed bottom scrolling
========================================================= */

const KEY = "resurgir_v13";
const OLD_KEY = "resurgir_v12";

/* -----------------------------
   BASIC DATA
----------------------------- */

   The mission is selected randomly/deterministically per day

  "IMPULSE SPENDING",

const RANKS = [
  [20,"RESURGIR"],
  [15,"UNBREAKABLE"],
  [11,"RESPECTED"],
  [8,"FORGED"],
  [5,"DISCIPLINED"],
  [2,"BUILT"],

/* -----------------------------
   STATE
----------------------------- */

function defaultState(){
  return {
    days:{},
    routines:JSON.parse(JSON.stringify(ROUTINES)),
    trainingLogs:[],
    foodLogs:[],
    wealthLogs:[],
    sideIncome:{},
    falls:[],
    reviews:{},
    responsibility:{},
    presence:{},
    createdAt:todayKey()
  };
}

function loadState(){
  try{
    const raw =
      localStorage.getItem(KEY) ||
      localStorage.getItem(OLD_KEY) ||
      localStorage.getItem(OLDER_KEY);

    if(!raw) return defaultState();

    const parsed=JSON.parse(raw);
    const base=defaultState();

    const s={
      ...base,
      ...parsed
    };

    s.days=s.days||{};
    s.routines=s.routines||base.routines;
    s.trainingLogs=s.trainingLogs||[];
    s.foodLogs=s.foodLogs||[];
    s.wealthLogs=s.wealthLogs||[];
    s.sideIncome=s.sideIncome||{};
    s.falls=s.falls||[];
    s.reviews=s.reviews||{};
    s.responsibility=s.responsibility||{};
    s.presence=s.presence||{};

    return s;

  }catch(e){
    return defaultState();
  }
}

/* -----------------------------
   DATE
----------------------------- */

function pad(n){
  return String(n).padStart(2,"0");
}

function todayKey(date=new Date()){
  return [
    date.getFullYear(),
    pad(date.getMonth()+1),
    pad(date.getDate())
  ].join("-");
}

function dateObj(key){
  const [y,m,d]=key.split("-").map(Number);
  return new Date(y,m-1,d);
}

function dayIndex(key=todayKey()){
  const d=dateObj(key);
  const start=new Date(d.getFullYear(),0,0);
  const diff=d-start;
  return Math.floor(diff/86400000);
}

/* -----------------------------
   RANDOM / SEEDED
----------------------------- */

function hashString(str){
  let h=2166136261;
  for(let i=0;i<str.length;i++){
    h^=str.charCodeAt(i);
    h=Math.imul(h,16777619);
  }
  return h>>>0;
}

function dailyMission(key=todayKey()){
  const index=hashString("mission-"+key)%MISSIONS.length;
  return MISSIONS[index];
}

function dailyCodes(key=todayKey()){
  const seed=hashString("code-"+key);
  const arr=[...DAILY_CODES];

  for(let i=arr.length-1;i>0;i--){
    const j=(seed+i*31)% (i+1);
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }

  return arr.slice(0,3);
}

/* -----------------------------
   DAY
----------------------------- */

function ensureToday(){
  const key=todayKey();

  if(!state.days[key]){
    state.days[key]={
      date:key,
      code:{},
      mission:false,
      workout:false,
      body:false,
      wealth:false,
      housework:false,
      responsibility:false,
      presence:false
    };
  }

  save();
  return state.days[key];
}

function dayHasActivity(day){
  if(!day) return false;

  return !!(
    day.mission ||
    day.workout ||
    day.body ||
    day.wealth ||
    day.housework ||
    day.responsibility ||
    day.presence ||
    Object.values(day.code||{}).some(Boolean)
  );
}

function hasFall(key){
  return state.falls.some(f=>f.date===key);
}

/* -----------------------------
   SCORE
----------------------------- */

function dayScore(day){
  if(!day) return 0;

  const selected=dailyCodes(day.date);

  let score=0;

  const completed=selected.filter(c=>day.code?.[c[0]]).length;
  score+=completed*10;

  if(day.mission) score+=15;
  if(day.workout) score+=25;
  if(day.body) score+=10;
  if(day.housework) score+=10;

  /*
    WEALTH is deliberately NOT a money-making score.
    It rewards avoiding wasteful spending.
  */
  if(day.wealth) score+=10;

  return Math.min(score,100);
}

function todayScore(){
  return dayScore(ensureToday());
}

function totalXP(){
  let xp=0;

  Object.values(state.days).forEach(day=>{
    xp+=dayScore(day);
  });

  return xp;
}

function levelFromXP(xp){
  return Math.max(1,Math.floor(xp/100)+1);
}

function rankFromLevel(level){
  for(const r of RANKS){
    if(level>=r[0]) return r[1];
  }
  return "AWAKEN";
}

function streak(){
  let count=0;
  let d=new Date();

  while(true){
    const key=todayKey(d);
    const day=state.days[key];

    if(!day || !dayHasActivity(day)) break;

    count++;
    d.setDate(d.getDate()-1);
  }

  return count;
}

function cleanDays(){
  let count=0;

  Object.entries(state.days).forEach(([key,day])=>{
    if(dayHasActivity(day) && !hasFall(key)){
      count++;
    }
  });

  return count;
}

  state.trainingLogs.forEach(log=>{

      if(ex.name===name){

      }
    });
  });

  if(!rows.length) return null;

  rows.sort((a,b)=>{
    if(b.kg!==a.kg) return b.kg-a.kg;
    return b.reps-a.reps;
  });

  return rows[0];
}

function weekStart(date=new Date()){
  const d=new Date(date);
  const day=d.getDay();
  const diff=day===0 ? -6 : 1-day;
  d.setDate(d.getDate()+diff);

  return todayKey(d);
}

function weekKey(date=new Date()){
  return weekStart(date);
}

function previousWeekKey(){
  const d=dateObj(weekKey());
  d.setDate(d.getDate()-7);
  return todayKey(d);
}

function weekDays(startKey){
  const start=dateObj(startKey);
  const arr=[];

  for(let i=0;i<7;i++){
    const d=new Date(start);
    d.setDate(d.getDate()+i);
    arr.push(todayKey(d));
  }

  return arr;
}

function weekStats(startKey){
  const days=weekDays(startKey);

  const records=days.map(k=>state.days[k]).filter(Boolean);

  const scores=records.map(dayScore);

  const total=scores.reduce((a,b)=>a+b,0);

  return {
    active:records.filter(dayHasActivity).length,
    workouts:records.filter(x=>x.workout).length,
    housework:records.filter(x=>x.housework).length,
    falls:days.filter(hasFall).length,
    avg:records.length ? Math.round(total/records.length) : 0,
    score:total,
    clean:days.filter(k=>{
      const d=state.days[k];
      return d && dayHasActivity(d) && !hasFall(k);
    }).length
  };
}

function reviewTarget(){

    Otherwise show the previous completed week.

  if(now.getDay()===0 && now.getHours()>=21){
    return weekKey(now);
  }

  return previousWeekKey();
}

  );

  };

   ROUTINE EDITOR
----------------------------- */

function editRoutine(name){
  const routine=state.routines[name];

  let html=`
    <div class="modal-title">${escapeHTML(name)}</div>
    <div class="modal-sub">ROUTINE EDITOR / メニュー編集</div>
  `;

  routine.forEach((ex,i)=>{
    html+=`
      <div class="field">
        <div class="field-label">EXERCISE ${i+1}</div>
        <input id="re_${i}_name"
          value="${escapeAttr(ex.name)}"
          placeholder="Exercise name">

        <div style="height:7px"></div>

        <div class="exercise-inputs">
          <input id="re_${i}_kg"
            type="number"
            step="0.5"
            value="${ex.weight}"
            placeholder="kg">

          <input id="re_${i}_reps"
            type="number"
            value="${ex.reps}"
            placeholder="reps">

          <input id="re_${i}_sets"
            type="number"
            value="${ex.sets}"
            placeholder="sets">
        </div>
      </div>
    `;
  });

  html+=`
    <button class="btn btn-primary"
      onclick='saveRoutine(${JSON.stringify(name)})'>
      SAVE ROUTINE
    </button>
  `;

  openModal(html);
}

function saveRoutine(name){
  const routine=state.routines[name];

  routine.forEach((ex,i)=>{
    ex.name=document.getElementById(`re_${i}_name`).value.trim()||ex.name;
    ex.weight=Number(document.getElementById(`re_${i}_kg`).value||ex.weight);
    ex.reps=Number(document.getElementById(`re_${i}_reps`).value||ex.reps);
    ex.sets=Number(document.getElementById(`re_${i}_sets`).value||ex.sets);
  });

  save();
  closeModal();
  render();

  toast("ROUTINE SAVED");
}

/* -----------------------------
   MODAL
----------------------------- */

function openModal(html){
  document.getElementById("modal").innerHTML=html;
  document.getElementById("modalBackdrop").classList.add("show");
}

function closeModal(){
  document.getElementById("modalBackdrop").classList.remove("show");
  document.getElementById("modal").innerHTML="";
}

document.getElementById("modalBackdrop").addEventListener("click",e=>{
  if(e.target.id==="modalBackdrop"){
    closeModal();
  }
});

/* -----------------------------
   TOAST
----------------------------- */

let toastTimer;

function toast(message){
  const el=document.getElementById("toast");

  el.textContent=message;
  el.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{
    el.classList.remove("show");
  },1800);
}

/* -----------------------------
   ESCAPE
----------------------------- */

function escapeHTML(value){
  return String(value??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeAttr(value){
  return escapeHTML(value);
}

/* -----------------------------
   NAVIGATION
----------------------------- */

let currentTab="HOME";

function go(tab){
  currentTab=tab;

  document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.classList.toggle(
      "active",
      btn.dataset.tab===tab
    );
  });

  render();
}

document.querySelectorAll(".nav-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    go(btn.dataset.tab);
    window.scrollTo({
      top:0,
      behavior:"smooth"
    });
  });
});

      <div class="card">

        <div class="card-title-row">
          <div>
            <div class="card-title">SIDE INCOME LOG</div>
            <span class="card-ja">副業収入</span>
          </div>

          <span class="badge">
            ${monthKey()}
          </span>
        </div>

        ${
          incomes.length
          ?
          incomes.map(x=>`
            <div class="log-item">

              <div class="row">
                <div class="log-title">
                  ¥${Number(x.amount).toLocaleString()}

                <div class="score-points">

          :

          月が変われば表示額は自動的に0からスタート。
          過去の月の記録自体は保持。
        </div>

      </div>

    </section>
  `;
}

/* -----------------------------
   RESET
----------------------------- */

function resetApp(){

  const ok=confirm(
    "RESURGIRの全データを削除します。\\n本当にリセットしますか？"
  );

  if(!ok) return;

  localStorage.removeItem(KEY);
  localStorage.removeItem(OLD_KEY);
  localStorage.removeItem(OLDER_KEY);

  state=defaultState();

  save();
  render();

  toast("SYSTEM RESET");
}

/* -----------------------------
   HEADER
----------------------------- */

function updateHeader(){

  const xp=totalXP();
  const level=levelFromXP(xp);
  const rank=rankFromLevel(level);

  document.getElementById("headerRank").textContent=rank;
  document.getElementById("headerLevel").textContent=`LV.${level}`;
}

/* -----------------------------
   RENDER
----------------------------- */

function render(){

  ensureToday();

  const screen=document.getElementById("screen");

  switch(currentTab){

    case "BUILD":
      screen.innerHTML=renderBuild();
      break;

    case "CODE":
      screen.innerHTML=renderCode();
      break;

    case "LOG":
      screen.innerHTML=renderLog();
      break;

    case "MORE":
      screen.innerHTML=renderMore();
      break;

    default:
      screen.innerHTML=renderHome();
  }

  updateHeader();

  updateTodayUI();
  updateHouseworkUI();
}

/* -----------------------------
   INIT
----------------------------- */

render();

/*
  Keep monthly income UI correct when
  the app remains open across midnight/month change.
*/
setInterval(()=>{
  if(currentTab==="BUILD" || currentTab==="HOME"){
    render();
  }
},60000);

</script>
