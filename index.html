<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>RESURGIR</title>

<style>
:root{
  --bg:#050505;
  --card:#111;
  --card2:#171717;
  --line:rgba(255,255,255,.08);
  --text:#f4f4f4;
  --muted:#858585;
  --soft:#aaa;
  --danger:#ff5555;
  --radius:20px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Noto Sans JP",
    sans-serif;
}

body{
  overscroll-behavior:none;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:620px;
  margin:auto;
  min-height:100vh;
  padding:0 16px calc(100px + env(safe-area-inset-bottom));
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:20;
  margin:0 -16px;
  padding:
    calc(12px + env(safe-area-inset-top))
    20px
    12px;
  background:rgba(5,5,5,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.05);
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:27px;
  font-weight:900;
  letter-spacing:.13em;
  background:linear-gradient(90deg,#fff,#777);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.header-meta{
  text-align:right;
  color:#777;
  font-size:9px;
  letter-spacing:.1em;
}

/* SCREENS */

.screen{
  display:none;
  padding-top:18px;
  animation:fade .2s ease;
}

.screen.active{
  display:block;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

/* TEXT */

.eyebrow{
  color:#777;
  font-size:9px;
  letter-spacing:.16em;
  text-transform:uppercase;
}

.title{
  font-size:26px;
  font-weight:900;
  letter-spacing:-.04em;
}

.jp{
  color:#777;
  font-size:10px;
  margin-top:4px;
}

.muted{
  color:var(--muted);
}

.tiny{
  color:#666;
  font-size:9px;
  line-height:1.65;
}

.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  margin:22px 2px 10px;
}

.section-head h2{
  margin:0;
  font-size:15px;
}

.section-head small{
  color:#666;
  font-size:9px;
}

/* CARD */

.card{
  background:linear-gradient(145deg,#121212,#0d0d0d);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:12px;
  box-shadow:0 10px 28px rgba(0,0,0,.2);
}

.hero{
  padding:22px 20px;
  overflow:hidden;
  position:relative;
}

.hero:after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  right:-90px;
  top:-90px;
  border:1px solid rgba(255,255,255,.06);
  border-radius:50%;
}

/* SCORE */

.score-row{
  display:flex;
  align-items:end;
  justify-content:space-between;
  margin-top:22px;
}

.score{
  font-size:58px;
  line-height:.9;
  font-weight:900;
  letter-spacing:-.07em;
}

.score-den{
  color:#666;
  font-size:12px;
  margin-left:5px;
}

.rank{
  color:#aaa;
  font-size:10px;
  line-height:1.6;
  text-align:right;
  letter-spacing:.1em;
}

.progress{
  height:6px;
  margin-top:15px;
  background:#252525;
  border-radius:99px;
  overflow:hidden;
}

.progress i{
  display:block;
  height:100%;
  background:#eee;
  border-radius:99px;
  transition:.25s;
}

/* GRID */

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.stat{
  padding:14px;
  background:#0b0b0b;
  border:1px solid rgba(255,255,255,.06);
  border-radius:15px;
}

.stat span{
  display:block;
  color:#666;
  font-size:9px;
}

.stat b{
  display:block;
  margin-top:5px;
  font-size:21px;
}

/* BUTTON */

.btn{
  width:100%;
  min-height:46px;
  padding:12px 14px;
  border-radius:12px;
  border:0;
  font-weight:800;
  transition:.1s;
}

.btn:active{
  transform:scale(.98);
}

.primary{
  background:#eee;
  color:#080808;
}

.secondary{
  background:#1d1d1d;
  color:#eee;
  border:1px solid rgba(255,255,255,.08);
}

.ghost{
  background:transparent;
  color:#aaa;
  border:1px solid rgba(255,255,255,.08);
}

.danger{
  background:#241010;
  color:#ff8888;
  border:1px solid rgba(255,85,85,.15);
}

.small{
  min-height:37px;
  padding:8px 10px;
  font-size:10px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.actions>*{
  flex:1;
}

/* MISSION */

.mission{
  border-left:2px solid #eee;
  padding-left:14px;
}

.mission-title{
  margin:6px 0;
  font-size:18px;
  font-weight:850;
}

.mission-desc{
  color:#aaa;
  font-size:11px;
  line-height:1.6;
}

.done .mission-title{
  color:#666;
  text-decoration:line-through;
}

/* QUICK */

.quick{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.quick button{
  min-height:68px;
  padding:8px 4px;
  color:#aaa;
  background:#101010;
  border:1px solid rgba(255,255,255,.07);
  border-radius:15px;
  font-size:9px;
}

.quick strong{
  display:block;
  color:#eee;
  font-size:18px;
  margin-bottom:4px;
}

/* CHECK */

.check-list{
  display:grid;
  gap:7px;
}

.check-row{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:52px;
  padding:10px;
  background:#0b0b0b;
  border:1px solid rgba(255,255,255,.055);
  border-radius:14px;
  cursor:pointer;
}

.check-toggle{
  appearance:none;
  -webkit-appearance:none;
  flex:0 0 24px;
  width:24px;
  height:24px;
  margin:0;
  background:#090909;
  border:1px solid #444;
  border-radius:7px;
  position:relative;
}

.check-toggle:checked{
  background:#eee;
  border-color:#eee;
}

.check-toggle:checked:after{
  content:"✓";
  position:absolute;
  left:4px;
  top:0;
  color:#080808;
  font-size:16px;
  font-weight:900;
}

.check-content{
  font-size:11px;
  line-height:1.4;
}

.check-content small{
  display:block;
  color:#666;
  font-size:9px;
  margin-top:2px;
}

/* TAG */

.tag{
  display:inline-flex;
  padding:5px 8px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:99px;
  color:#aaa;
  font-size:8px;
  letter-spacing:.08em;
}

/* RULE */

.rule{
  margin-top:11px;
  padding:10px 12px;
  background:#090909;
  border:1px solid rgba(255,255,255,.05);
  border-radius:12px;
}

.rule summary{
  color:#777;
  cursor:pointer;
  font-size:9px;
  letter-spacing:.1em;
}

.rule-body{
  margin-top:9px;
  color:#777;
  font-size:9px;
  line-height:1.7;
}

/* INPUT */

.field{
  margin-bottom:12px;
}

.field label{
  color:#777;
  font-size:9px;
  letter-spacing:.08em;
}

.input{
  width:100%;
  margin-top:6px;
  padding:12px;
  background:#090909;
  border:1px solid #292929;
  border-radius:12px;
  color:#eee;
  outline:none;
}

.input:focus{
  border-color:#555;
}

textarea.input{
  min-height:95px;
  resize:vertical;
}

/* EXERCISE */

.exercise{
  padding:13px;
  margin-top:8px;
  background:#0b0b0b;
  border:1px solid rgba(255,255,255,.055);
  border-radius:14px;
}

.exercise-name{
  font-size:12px;
  font-weight:800;
}

.prescription{
  color:#666;
  font-size:9px;
  margin-top:4px;
}

.exercise-inputs{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
  margin-top:9px;
}

.exercise-inputs input{
  width:100%;
  padding:9px;
  background:#121212;
  border:1px solid #252525;
  border-radius:9px;
  color:#eee;
}

/* LOG */

.log-item{
  padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.log-item:last-child{
  border-bottom:0;
}

.log-title{
  font-size:11px;
  font-weight:750;
}

.log-meta{
  color:#666;
  font-size:9px;
  line-height:1.55;
  margin-top:3px;
}

/* METER */

.meter{
  height:4px;
  margin-top:6px;
  background:#252525;
  border-radius:99px;
  overflow:hidden;
}

.meter i{
  display:block;
  height:100%;
  background:#eee;
}

/* NAV */

.bottom-nav{
  position:fixed;
  z-index:30;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:min(620px,100%);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  padding:
    8px 12px
    calc(8px + env(safe-area-inset-bottom));
  background:rgba(7,7,7,.9);
  backdrop-filter:blur(22px);
  border-top:1px solid rgba(255,255,255,.07);
}

.nav-btn{
  min-height:57px;
  border:0;
  background:transparent;
  color:#555;
  font-size:8px;
}

.nav-btn strong{
  display:block;
  margin-bottom:4px;
  color:#666;
  font-size:17px;
}

.nav-btn.active{
  color:#eee;
}

.nav-btn.active strong{
  color:#eee;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  align-items:end;
  justify-content:center;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(8px);
}

.modal.open{
  display:flex;
}

.sheet{
  width:min(620px,100%);
  max-height:90vh;
  overflow:auto;
  padding:
    18px 16px
    calc(25px + env(safe-area-inset-bottom));
  background:#111;
  border:1px solid rgba(255,255,255,.08);
  border-bottom:0;
  border-radius:24px 24px 0 0;
}

.sheet-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.sheet-head h2{
  margin:3px 0 0;
  font-size:18px;
}

.close{
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:#222;
  color:#aaa;
}

/* TOAST */

.toast{
  position:fixed;
  z-index:100;
  left:50%;
  bottom:100px;
  transform:translate(-50%,10px);
  opacity:0;
  padding:10px 15px;
  background:#eee;
  color:#080808;
  border-radius:99px;
  font-size:10px;
  font-weight:850;
  pointer-events:none;
  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

.big-quote{
  font-size:20px;
  line-height:1.45;
  font-weight:850;
}

.signature{
  margin-top:9px;
  color:#666;
  font-size:9px;
  letter-spacing:.08em;
}

.empty{
  padding:18px;
  text-align:center;
  color:#666;
  font-size:10px;
}

.divider{
  height:1px;
  margin:14px 0;
  background:rgba(255,255,255,.06);
}

@media(min-width:700px){
  .modal{
    align-items:center;
  }

  .sheet{
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="header-row">
    <div class="logo">RESURGIR</div>
    <div class="header-meta" id="headerMeta"></div>
  </div>
</header>

<main>

<section id="today" class="screen active"></section>
<section id="build" class="screen"></section>
<section id="code" class="screen"></section>
<section id="log" class="screen"></section>
<section id="man" class="screen"></section>

</main>
</div>

<nav class="bottom-nav">

<button class="nav-btn active" data-page="today">
  <strong>⌂</strong>
  TODAY<br>今日
</button>

<button class="nav-btn" data-page="build">
  <strong>◒</strong>
  BUILD<br>鍛錬
</button>

<button class="nav-btn" data-page="code">
  <strong>◇</strong>
  CODE<br>掟
</button>

<button class="nav-btn" data-page="log">
  <strong>≡</strong>
  LOG<br>戦記
</button>

<button class="nav-btn" data-page="man">
  <strong>◎</strong>
  MAN<br>己
</button>

</nav>

<div class="modal" id="modal">
  <div class="sheet" id="sheet"></div>
</div>

<div class="toast" id="toast"></div>

<script>

/* =========================================================
   RESURGIR 3.1
   MANHOOD OS
   ========================================================= */

const STORAGE_KEY = "resurgir_v13";

/* ---------- DATA ---------- */

const DAILY_CODES = [
  ["KEEP YOUR WORD","自分との約束を守る","言ったことを、行動で終わらせる。"],
  ["DON'T RUN","面倒でも逃げない","避けたいことに一歩だけ向き合う。"],
  ["NO FALSE RECORDS","記録に嘘をつかない","できなかった日は、できなかったと書く。"],
  ["CONTROL YOURSELF","己を律する","反応する前に、一度止まる。"],
  ["NO BLAME","人のせいにしない","自分が変えられる部分に集中する。"],
  ["RESPECT","人を雑に扱わない","強さは他人への態度にも出る。"],
  ["DO IT TODAY","今日やるべきことを今日やる","先延ばしを一つ終わらせる。"],
  ["UNSEEN WORK","見えない場所でも手を抜かない","誰も見ていない場所こそ自分との勝負。"]
];

const QUESTS = [
  ["THE FIRST MOVE","先延ばしにしていることを5分だけ始める。"],
  ["THE HARD MESSAGE","必要だと分かっている連絡を送る。"],
  ["THE CLEAN ROOM","目につく場所を15分だけ整える。"],
  ["THE NO","必要のない要求を一つ断る。"],
  ["THE APOLOGY","自分に非があることを一つ認める。"],
  ["THE FINISH","途中で止めていることを一つ終わらせる。"]
];

const BOSSES = [
  ["THE MAN WHO DOESN'T RUN","逃げている問題を一つ片付ける。"],
  ["THE FINISHER","先週から残っていることを一つ完了させる。"],
  ["THE DISCIPLINED WEEK","決めたルーティンを淡々と守る。"],
  ["THE CLEAN SLATE","生活・仕事・部屋のどれか一つを整える。"]
];

const CONSTITUTION = [
  ["KEEP YOUR WORD","自分との約束を守る。"],
  ["DON'T RUN","嫌なことから逃げない。"],
  ["NO FALSE RECORDS","記録に嘘をつかない。"],
  ["SMALL WINS COUNT","小さな勝利も前進として記録する。"],
  ["NEVER MISS TWICE","一度崩れても、二日続けて崩さない。"],
  ["FALL IS NOT FAILURE","崩れることではなく、戻らないことが敗北。"],
  ["RESURGIR","何度でも戻る。"]
];

const DEFAULT_ROUTINES = {
  PUSH:[
    ["Bench Press",60,6,3],
    ["Incline Press",40,8,3],
    ["Shoulder Press",16,8,3],
    ["Side Raise",5,12,3]
  ],
  PULL:[
    ["Lat Pulldown",61,8,3],
    ["Row",40,8,3],
    ["Rear Delt",35,10,3],
    ["Biceps Curl",10,10,3]
  ],
  LEGS:[
    ["Squat",60,5,3],
    ["RDL",40,8,3],
    ["Leg Extension",50,10,3],
    ["Leg Curl",30,10,3]
  ]
};

const CATEGORIES = [
  "BODY",
  "DISCIPLINE",
  "COURAGE",
  "RESPONSIBILITY",
  "RESPECT",
  "PRESENCE",
  "LOVE",
  "WEALTH"
];

/* ---------- HELPERS ---------- */

const $ = selector =>
  document.querySelector(selector);

const esc = value =>
  String(value ?? "")
    .replace(/[&<>"']/g, c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c]));

function today(){

  const d = new Date();

  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");
}

function dateLabel(date){

  return new Date(date+"T12:00:00")
    .toLocaleDateString("ja-JP",{
      month:"short",
      day:"numeric",
      weekday:"short"
    });
}

function dayNumber(){

  return Math.floor(
    new Date(today()+"T12:00:00").getTime()
    /86400000
  );
}

function weekKey(){

  const d =
    new Date(today()+"T12:00:00");

  const day = d.getDay();

  const diff =
    day === 0 ? 0 : 7-day;

  d.setDate(d.getDate()+diff);

  return d.toISOString().slice(0,10);
}

/* ---------- STATE ---------- */

function defaultState(){

  return {
    days:{},

    mission:"",

    weight:null,

    income:null,
    sideIncome:null,

    routines:
      JSON.parse(
        JSON.stringify(DEFAULT_ROUTINES)
      ),

    trainingLogs:[],
    food:[],
    falls:[],
    reviews:{},

    responsibility:{},
    presence:{},

    quest:null,
    boss:null
  };
}

function load(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(STORAGE_KEY)
      );

    return saved
      ? {...defaultState(),...saved}
      : defaultState();

  }catch{

    return defaultState();

  }
}

let state = load();

let currentPage = "today";
let currentRoutine = "PUSH";

/* ---------- SAVE ---------- */

function save(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );
}

/* ---------- DAY ---------- */

function getDay(){

  if(!state.days[today()]){

    state.days[today()] = {

      code:{},

      mission:state.mission || "",
      missionDone:false,

      body:false,
      wealth:false,

      quest:false,
      boss:false
    };
  }

  return state.days[today()];
}

/* ---------- DAILY ROTATION ---------- */

function dailyCodes(){

  const list =
    DAILY_CODES.map(x => [...x]);

  let seed = dayNumber();

  for(let i=list.length-1;i>0;i--){

    seed =
      (seed*9301+49297)%233280;

    const j =
      Math.floor(
        seed/233280*(i+1)
      );

    [list[i],list[j]] =
      [list[j],list[i]];
  }

  return list.slice(0,3);
}

/* ---------- ROUTINE ---------- */

function routineForToday(){

  const day =
    new Date().getDay();

  if(day===0)
    return "LEGS";

  if(day===6)
    return "REST";

  if(day%2===1)
    return "PUSH";

  return "PULL";
}

/* ---------- ENSURE ---------- */

function ensure(){

  getDay();

  if(
    !state.quest ||
    state.quest.date !== today()
  ){

    const q =
      QUESTS[
        dayNumber()%QUESTS.length
      ];

    state.quest = {
      date:today(),
      title:q[0],
      desc:q[1],
      done:false
    };
  }

  if(
    !state.boss ||
    state.boss.week !== weekKey()
  ){

    const b =
      BOSSES[
        Math.floor(dayNumber()/7)
        %BOSSES.length
      ];

    state.boss = {
      week:weekKey(),
      title:b[0],
      desc:b[1],
      done:false
    };
  }

  currentRoutine =
    routineForToday();

  save();
}

/* ---------- SCORE ---------- */

function todayScore(){

  const d = getDay();

  const codeCount =
    dailyCodes().filter(
      (_,i)=>d.code[i]
    ).length;

  let score =
    Math.round(
      codeCount/3*30
    );

  if(d.body)
    score += 25;

  if(d.wealth)
    score += 10;

  if(d.quest)
    score += 15;

  if(d.boss)
    score += 10;

  if(d.missionDone)
    score += 10;

  return Math.min(100,score);
}

/* ---------- XP ---------- */

function totalXP(){

  let xp = 0;

  for(
    const [date,d]
    of Object.entries(state.days)
  ){

    if(date===today())
      continue;

    xp +=
      Object.values(d.code||{})
        .filter(Boolean).length*10;

    if(d.body)
      xp+=25;

    if(d.wealth)
      xp+=10;

    if(d.quest)
      xp+=15;

    if(d.boss)
      xp+=10;

    if(d.missionDone)
      xp+=10;
  }

  return xp+todayScore();
}

/* ---------- LEVEL ---------- */

function level(){

  const xp = totalXP();

  const thresholds = [
    0,
    150,
    350,
    600,
    900,
    1300,
    1800,
    2400,
    3100,
    4000,
    5000
  ];

  let lv=1;

  thresholds.forEach(
    (value,index)=>{
      if(xp>=value)
        lv=index+1;
    }
  );

  return lv;
}

function rank(){

  const lv=level();

  if(lv>=20)
    return "RESURGIR";

  if(lv>=15)
    return "UNBREAKABLE";

  if(lv>=11)
    return "RESPECTED";

  if(lv>=8)
    return "FORGED";

  if(lv>=5)
    return "DISCIPLINED";

  if(lv>=3)
    return "BUILT";

  return "AWAKEN";
}

/* ---------- STREAK ---------- */

function streak(){

  let count=0;

  const d =
    new Date(today()+"T12:00:00");

  for(let i=0;i<365;i++){

    const key =
      d.toISOString().slice(0,10);

    const day =
      state.days[key];

    if(
      !day ||
      !(
        day.body ||
        day.wealth ||
        day.quest ||
        day.missionDone ||
        Object.values(day.code||{})
          .some(Boolean)
      )
    )
      break;

    count++;

    d.setDate(
      d.getDate()-1
    );
  }

  return count;
}

/* ---------- UI ---------- */

function toast(message){

  const el=$("#toast");

  el.textContent=message;

  el.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(
      ()=>el.classList.remove("show"),
      1600
    );
}

function rules(items){

  return `
  <details class="rule">
    <summary>ⓘ RULES / 使い方</summary>

    <div class="rule-body">

      ${items
        .map(x=>"• "+x)
        .join("<br>")}

    </div>
  </details>
  `;
}

function navigate(page){

  currentPage=page;

  document
    .querySelectorAll(".nav-btn")
    .forEach(btn=>{

  document
    .querySelectorAll(".screen")
    .forEach(screen=>{
      screen.classList.toggle(
        "active",
        screen.id===page

  window.scrollTo(0,0);
}

function weeklyStats(){

  const start =
    new Date(weekKey()+"T12:00:00");

  const dates =
    Object.keys(state.days)
      .filter(date=>
        new Date(date+"T12:00:00")
          >=start
      );

  const average =
    dates.length
      ? Math.round(
          dates.reduce(
            (sum,date)=>
              sum+
              (date===today()
                ?todayScore()
                :historicalScore(
                  state.days[date]
                )),
            0
          )/dates.length
        )
      :0;

  return `

    <div class="grid2">

      <div class="stat">
        <span>AVG SCORE</span>
        <b>${average}</b>
      </div>

      <div class="stat">
        <span>ACTIVE DAYS</span>
        <b>${dates.length}</b>
      </div>

    </div>

    <div class="tiny"
         style="margin-top:10px">

      日曜夜に一週間を締め、
      来週の自分を決める。

    </div>
  `;
}

function historicalScore(d){

  let s =
    Math.round(
      Object.values(d.code||{})
        .filter(Boolean).length/3*30
    );

  if(d.body)s+=25;
  if(d.wealth)s+=10;
  if(d.quest)s+=15;
  if(d.boss)s+=10;
  if(d.missionDone)s+=10;

  return Math.min(100,s);
}

        ?78:55,

}

      "New Exercise",
      0,
      10,
      3
    ]);

  save();

  openRoutineEditor();
}

function addRoutine(){

  const name =
    prompt("Routine name");

  if(!name || !name.trim())
    return;

  state.routines[name.trim()]=[];

  save();

  openRoutineEditor();
}

function deleteRoutine(name){

  if(
    Object.keys(state.routines).length<=1
  ){

    toast("最低1つ必要です");

    return;
  }

  delete state.routines[name];

  currentRoutine =
    Object.keys(state.routines)[0];

  save();

  openRoutineEditor();
}

/* ---------- RESET ---------- */

function resetApp(){

  const yes =
    confirm(
      "全データを削除して初期状態に戻しますか？"
    );

  if(!yes)
    return;

  localStorage.removeItem(
    STORAGE_KEY
  );

  state=defaultState();

  ensure();

  render();

  toast("RESET COMPLETE");
}

/* ---------- GLOBAL RENDER ---------- */

function render(){

  ensure();

  renderToday();
  renderBuild();
  renderCode();
  renderLog();
  renderMan();

  document
    .querySelectorAll(".screen")
    .forEach(screen=>{
      screen.classList.toggle(
        "active",
        screen.id===currentPage
      );
    });
}

/* ---------- NAV EVENTS ---------- */

document
  .querySelectorAll(".nav-btn")
  .forEach(button=>{

    button.addEventListener(
      "click",
      ()=>{
        navigate(
          button.dataset.page
        );
      }
    );

  });

document.addEventListener(
  "keydown",
  event=>{
    if(event.key==="Escape")
      closeModal();
  }
);

/* ---------- START ---------- */

ensure();
render();

</script>

</body>
</html>
