<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>RESURGIR</title>

<style>
:root{
  --bg:#050505;
  --card:#111;
  --elevated:#1a1a1a;
  --border:rgba(255,255,255,.08);
  --text:#f5f5f5;
  --muted:#888;
  --dim:#555;
  --danger:#ff5555;
  --radius:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}
body{min-height:100vh;overscroll-behavior:none}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer}
.app{
  width:100%;
  max-width:620px;
  min-height:100vh;
  margin:auto;
  padding-bottom:100px;
}
.header{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 18px 14px;
  background:rgba(5,5,5,.84);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.04);
}
.logo{
  font-size:28px;
  line-height:1;
  font-weight:900;
  letter-spacing:.13em;
  background:linear-gradient(90deg,#fff,#777);
  -webkit-background-clip:text;
  color:transparent;
}
.rank{text-align:right}
.rank strong{
  display:block;
  font-size:11px;
  letter-spacing:.13em;
}
.rank span{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:9px;
  letter-spacing:.1em;
}
.screen{
  padding:18px;
  animation:fade .2s ease;
}
@keyframes fade{
  from{opacity:0;transform:translateY(5px)}
  to{opacity:1;transform:none}
}
.hero{padding:25px 0 20px}
.eyebrow{
  margin-bottom:12px;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  letter-spacing:.2em;
}
.hero h1{
  margin:0;
  max-width:540px;
  font-size:32px;
  line-height:1.04;
  letter-spacing:-.045em;
}
.hero-jp{
  margin-top:10px;
  color:#777;
  font-size:12px;
}
.card{
  margin-bottom:12px;
  padding:18px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:0 10px 30px rgba(0,0,0,.16);
}
.card-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  margin-bottom:15px;
}
.card-title{
  font-size:12px;
  font-weight:900;
  letter-spacing:.14em;
}
.card-sub{
  margin-top:4px;
  color:#666;
  font-size:9px;
  letter-spacing:.06em;
}
.score-wrap{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
}
.score{
  font-size:56px;
  line-height:.9;
  font-weight:900;
  letter-spacing:-.06em;
}
.score-label{
  margin-bottom:5px;
  color:#777;
  font-size:9px;
  letter-spacing:.13em;
}
.progress{
  height:6px;
  margin-top:17px;
  overflow:hidden;
  background:#222;
  border-radius:99px;
}
.progress div{
  height:100%;
  background:#eee;
  border-radius:99px;
  transition:.25s;
}
.stat-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.stat{
  padding:14px;
  background:#0b0b0b;
  border:1px solid rgba(255,255,255,.05);
  border-radius:14px;
}
.stat-label{
  color:#666;
  font-size:9px;
  letter-spacing:.12em;
}
.stat-value{
  margin-top:5px;
  font-size:23px;
  font-weight:850;
}
.stat-jp{
  margin-top:3px;
  color:#555;
  font-size:9px;
}
.mission{
  position:relative;
  overflow:hidden;
}
.mission:before{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  left:0;
  width:3px;
  background:#eee;
}
.mission-cat{
  display:inline-block;
  margin-bottom:11px;
  color:#777;
  font-size:9px;
  font-weight:850;
  letter-spacing:.17em;
}
.mission h2{
  margin:0;
  font-size:22px;
  line-height:1.25;
  letter-spacing:-.025em;
}
.mission-en{
  margin-top:8px;
  color:#666;
  font-size:10px;
  line-height:1.45;
}
.mission-meta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:17px 0 13px;
}
.xp{
  font-size:10px;
  font-weight:850;
  letter-spacing:.1em;
}
.btn{
  width:100%;
  min-height:46px;
  padding:12px 15px;
  border-radius:12px;
  font-size:11px;
  font-weight:850;
  letter-spacing:.06em;
}
.btn:active{transform:scale(.98)}
.primary{background:#f5f5f5;color:#050505}
.secondary{
  background:#1b1b1b;
  color:#eee;
  border:1px solid rgba(255,255,255,.08);
}
.danger{
  background:rgba(255,85,85,.12);
  color:#ff7777;
  border:1px solid rgba(255,85,85,.2);
}
.small-btn{
  width:auto;
  min-height:36px;
  padding:9px 12px;
  font-size:9px;
}
.btn-row{
  display:flex;
  gap:8px;
}
.btn-row .btn{flex:1}
.check-list{
  display:flex;
  flex-direction:column;
  gap:7px;
}
.check-item{
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px;
  background:#0b0b0b;
  border:1px solid rgba(255,255,255,.05);
  border-radius:13px;
}
.check-toggle{
  width:20px;
  height:20px;
  flex:0 0 20px;
  padding:0;
  background:transparent;
  border:1px solid #555;
  border-radius:6px;
}
.check-toggle.active{
  background:#eee;
  border-color:#eee;
}
.check-toggle.active:after{
  content:"✓";
  color:#050505;
  font-size:13px;
  font-weight:900;
}
.check-content{flex:1;min-width:0}
.check-main{
  font-size:12px;
  font-weight:750;
  line-height:1.3;
}
.check-sub{
  margin-top:3px;
  color:#555;
  font-size:8px;
}
.check-item.done{opacity:.48}
.check-item.done .check-main{text-decoration:line-through}
.section-title{
  margin:28px 0 11px;
  font-size:11px;
  font-weight:900;
  letter-spacing:.17em;
}
.section-title span{
  margin-left:7px;
  color:#555;
  font-size:8px;
}
.tiny{
  color:#666;
  font-size:9px;
  line-height:1.55;
}
.rule-box{
  padding:13px;
  background:#0b0b0b;
  border:1px solid rgba(255,255,255,.05);
  border-radius:14px;
}
.rule-row{
  padding:11px 0;
  border-bottom:1px solid rgba(255,255,255,.05);
}
.rule-row:last-child{border-bottom:0}
.rule-en{
  font-size:10px;
  font-weight:850;
  letter-spacing:.06em;
}
.rule-jp{
  margin-top:4px;
  color:#666;
  font-size:8px;
  line-height:1.5;
}
.list{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.list-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:13px;
  background:#0b0b0b;
  border:1px solid rgba(255,255,255,.05);
  border-radius:13px;
}
.list-main{min-width:0}
.list-title{
  font-size:11px;
  font-weight:750;
}
.list-sub{
  margin-top:3px;
  color:#555;
  font-size:8px;
}
.tag{
  padding:5px 7px;
  white-space:nowrap;
  color:#888;
  background:#1b1b1b;
  border-radius:7px;
  font-size:8px;
}
input,textarea,select{
  width:100%;
  padding:12px;
  color:#eee;
  background:#0a0a0a;
  border:1px solid rgba(255,255,255,.09);
  border-radius:11px;
  outline:none;
}
textarea{min-height:100px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:#666}
.field{margin-bottom:11px}
.field label{
  display:block;
  margin-bottom:6px;
  color:#777;
  font-size:9px;
  letter-spacing:.1em;
}
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}
.exercise{
  margin-bottom:8px;
  padding:13px;
  background:#0b0b0b;
  border:1px solid rgba(255,255,255,.05);
  border-radius:14px;
}
.exercise-name{
  margin-bottom:8px;
  font-size:12px;
  font-weight:800;
}
.exercise-target{
  margin-bottom:9px;
  color:#666;
  font-size:9px;
}
.exercise-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
}
.exercise-grid label{
  display:block;
  margin-bottom:4px;
  color:#555;
  font-size:8px;
}
.review-stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}
.review-stat{
  padding:10px 5px;
  text-align:center;
  background:#0b0b0b;
  border-radius:11px;
}
.review-stat strong{
  display:block;
  font-size:18px;
}
.review-stat span{
  display:block;
  margin-top:3px;
  color:#555;
  font-size:7px;
}
.status{
  display:inline-flex;
  padding:5px 8px;
  background:#1a1a1a;
  border-radius:7px;
  color:#999;
  font-size:8px;
  font-weight:800;
  letter-spacing:.08em;
}
.status.open{color:#eee}
.status.done{color:#aaa}
.bar-row{margin-bottom:11px}
.bar-label{
  display:flex;
  justify-content:space-between;
  margin-bottom:5px;
  color:#777;
  font-size:9px;
}
.bar{
  height:5px;
  overflow:hidden;
  background:#222;
  border-radius:99px;
}
.bar div{
  height:100%;
  background:#ddd;
}
.quote{
  padding:15px;
  border-left:2px solid #444;
  color:#aaa;
  font-size:11px;
  line-height:1.6;
}
.nav{
  position:fixed;
  z-index:30;
  bottom:0;
  left:50%;
  width:min(620px,100%);
  transform:translateX(-50%);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
  padding:9px 10px calc(9px + env(safe-area-inset-bottom));
  background:rgba(8,8,8,.91);
  border-top:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}
.nav-btn{
  padding:8px 2px;
  background:transparent;
  border-radius:10px;
  color:#555;
}
.nav-btn.active{
  background:#171717;
  color:#eee;
}
.nav-main{
  display:block;
  font-size:9px;
  font-weight:900;
  letter-spacing:.1em;
}
.nav-jp{
  display:block;
  margin-top:3px;
  font-size:7px;
}
.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.72);
}
.modal-backdrop.open{display:flex}
.modal{
  width:min(620px,100%);
  max-height:90vh;
  overflow:auto;
  padding:20px 18px calc(24px + env(safe-area-inset-bottom));
  background:#111;
  border:1px solid rgba(255,255,255,.09);
  border-radius:22px 22px 0 0;
}
.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}
.modal-title{
  font-size:14px;
  font-weight:900;
  letter-spacing:.1em;
}
.close{
  width:34px;
  height:34px;
  background:#222;
  border-radius:50%;
  color:#aaa;
}
.toast{
  position:fixed;
  z-index:100;
  bottom:90px;
  left:50%;
  padding:11px 15px;
  transform:translateX(-50%) translateY(10px);
  opacity:0;
  pointer-events:none;
  background:#eee;
  color:#050505;
  border-radius:10px;
  font-size:10px;
  font-weight:850;
  transition:.2s;
}
.toast.show{
  opacity:1;
  transform:translateX(-50%);
}
.empty{
  padding:12px 0;
  color:#555;
  font-size:10px;
}
@media(min-width:621px){
  .modal-backdrop{align-items:center}
  .modal{border-radius:22px;max-height:85vh}
}
</style>
</head>

<body>

<div id="app"></div>

<nav class="nav">
  <button class="nav-btn active" data-screen="HOME">
    <span class="nav-main">HOME</span>
    <span class="nav-jp">今日</span>
  </button>
  <button class="nav-btn" data-screen="BUILD">
    <span class="nav-main">BUILD</span>
    <span class="nav-jp">鍛える</span>
  </button>
  <button class="nav-btn" data-screen="CODE">
    <span class="nav-main">CODE</span>
    <span class="nav-jp">戒律</span>
  </button>
  <button class="nav-btn" data-screen="LOG">
    <span class="nav-main">LOG</span>

  </button>

    <span class="nav-main">MORE</span>

</nav>

<div id="modalBackdrop" class="modal-backdrop">

</div>

<div id="toast" class="toast"></div>

/* =========================================================
   DATE
   ========================================================= */

function dateKey(d=new Date()){
 const y=d.getFullYear();
 const m=String(d.getMonth()+1).padStart(2,"0");
 const day=String(d.getDate()).padStart(2,"0");
 return `${y}-${m}-${day}`;
}

function todayKey(){
 return dateKey(new Date());
}

function parseDate(key){
 const [y,m,d]=key.split("-").map(Number);
 return new Date(y,m-1,d);
}

function addDays(d,n){
 const x=new Date(d);
 x.setDate(x.getDate()+n);
 return x;
}

function weekKey(key=todayKey()){
 const d=parseDate(key);
 const dow=d.getDay();
 const diff=dow===0?-6:1-dow;
 d.setDate(d.getDate()+diff);
 return dateKey(d);
}

function weekDays(wk=weekKey()){
 const monday=parseDate(wk);
 return Array.from({length:7},(_,i)=>dateKey(addDays(monday,i)));
}

function previousWeekKey(wk=weekKey()){
 return dateKey(addDays(parseDate(wk),-7));
}

function weekLabel(wk){
 const a=parseDate(wk);
 const b=addDays(a,6);
 return `${a.getMonth()+1}/${a.getDate()} — ${b.getMonth()+1}/${b.getDate()}`;
}

/* =========================================================
   HASH / RANDOM
   ========================================================= */

function hash(str){
 let h=2166136261;

 for(let i=0;i<str.length;i++){
  h^=str.charCodeAt(i);
  h+=
   (h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24);
 }

 return Math.abs(h>>>0);
}

function randomFromSeed(seed,length){
 return hash(seed)%length;
}

/*
  毎日違うMISSION。
  同じ日ならアプリを何度開いても同じ。
*/

function getMission(key=todayKey()){
 if(!state.missions[key]){
  let pool=MISSIONS;

  const yesterday=dateKey(addDays(parseDate(key),-1));
  const yesterdayId=state.missions[yesterday];

  if(yesterdayId){
   pool=pool.filter(m=>m.id!==yesterdayId);
  }

  const index=randomFromSeed(
   key+"|MISSION",
   pool.length
  );

  state.missions[key]=pool[index].id;
  state.rerolls[key]=0;
  save();
 }

 return MISSIONS.find(m=>m.id===state.missions[key])||MISSIONS[0];
}

function rerollMission(){
 const key=todayKey();

 if((state.rerolls[key]||0)>=1){
  toast("REROLLは1日1回まで");
  return;
 }

 const current=getMission(key);

 let pool=MISSIONS.filter(m=>m.id!==current.id);

 const yesterday=dateKey(addDays(parseDate(key),-1));
 const yesterdayId=state.missions[yesterday];

 if(yesterdayId){
  pool=pool.filter(m=>m.id!==yesterdayId);
 }

 const index=randomFromSeed(
  key+"|REROLL|"+Date.now(),
  pool.length
 );

 state.missions[key]=pool[index].id;
 state.rerolls[key]=1;

 save();
 render();
 toast("MISSION REROLLED");
}

/* =========================================================

   ========================================================= */

function dailyCodes(key=todayKey()){
 return [...DAILY_CODES]
  .sort((a,b)=>
   hash(key+"|CODE|"+a.id)-
   hash(key+"|CODE|"+b.id)
  )
  .slice(0,3);
}

/* =========================================================
   SCORE
   =========================================================

   CODE       30
   WORKOUT    25
   BODY       10
   WEALTH     10  ← 無駄遣いなし
   MISSION    15

   MAX = 90
   ※Weekly Bossは完全削除
*/

function scoreForDay(d){
 if(!d)return 0;

 const codes=dailyCodeCount(d.date)*10;

 let score=codes;

 if(d.workout)score+=25;
 if(d.body)score+=10;

 /*
   waste=false → 無駄遣いなし
   waste=true  → 無駄遣いあり
   未記録は0点。
 */
 if(d.waste===false && d.wealthChecked){
  score+=10;
 }

 if(d.mission)score+=15;

 return Math.min(90,score);
}

function dailyCodeCount(key){
 const d=state.days[key];
 if(!d||!d.code)return 0;

 return dailyCodes(key)
  .filter(c=>d.code[c.id])
  .length;
}

function todayScore(){
 return scoreForDay(today());
}

function totalXP(){
 return Object.values(state.days)
  .reduce((sum,d)=>sum+scoreForDay(d),0);
}

/* =========================================================
   LEVEL
   ========================================================= */

function levelInfo(){
 const xp=totalXP();

 const levels=[
  [0,"AWAKEN"],
  [250,"BUILT"],
  [600,"DISCIPLINED"],
  [1200,"FORGED"],
  [2200,"RESPECTED"],
  [4000,"UNBREAKABLE"],
  [7000,"RESURGIR"]
 ];

 let level=1;
 let rank=levels[0][1];
 let base=0;
 let next=250;

 levels.forEach((x,i)=>{
  if(xp>=x[0]){
   level=i+1;
   rank=x[1];
   base=x[0];
   next=levels[i+1]?levels[i+1][0]:x[0]+3000;
  }
 });

 return {
  xp,
  level,
  rank,
  progress:Math.max(
   0,
   Math.min(
    100,
    ((xp-base)/(next-base))*100
   )
  )
 };
}

/* =========================================================
   STREAK
   ========================================================= */

function hasActivity(key){
 const d=state.days[key];

 if(!d)return false;

 return scoreForDay(d)>0 ||
  state.falls.some(f=>f.date===key);
}

function streak(){
 let count=0;
 let d=new Date();

 while(true){
  const key=dateKey(d);

  if(!hasActivity(key))break;

  count++;
  d.setDate(d.getDate()-1);

  if(count>1000)break;
 }

 return count;
}

/* =========================================================
   WEEKLY REVIEW
   Weekly Bossは存在しない。
   レビューだけ日曜夜に行う。
   ========================================================= */

function reviewTargetWeek(){
 const now=new Date();
 const dow=now.getDay();
 const hour=now.getHours();

 /*
   日曜21時以降 → 今週
   それ以外 → 先週
 */
 if(dow===0 && hour>=21){
  return weekKey();
 }

 return previousWeekKey();
}

function reviewStatus(){
 const wk=reviewTargetWeek();
 const review=state.weeklyReviews[wk];

 if(review)return "DONE";

 const now=new Date();

 if(now.getDay()===0 && now.getHours()>=21){
  return "OPEN";
 }

 return "SCHEDULED";
}

function weeklyStats(wk){
 const days=weekDays(wk);

 let score=0;
 let workouts=0;
 let missions=0;
 let clean=0;
 let falls=0;

 days.forEach(key=>{
  const d=state.days[key];

  if(d){
   score+=scoreForDay(d);

   if(d.workout)workouts++;
   if(d.mission)missions++;
  }

  const hasFall=state.falls.some(f=>f.date===key);

  if(hasFall){
   falls++;
  }else if(d&&scoreForDay(d)>0){
   clean++;
  }
 });

 return {
  score,
  average:Math.round(score/7),
  workouts,
  missions,
  clean,
  falls
 };
}

/* =========================================================
   MANHOOD SCORE
   行動履歴から算出する「行動指数」。
   ========================================================= */

function manhoodScores(){
 const days=Object.values(state.days);

 const active=days.filter(d=>scoreForDay(d)>0).length;
 const workouts=days.filter(d=>d.workout).length;
 const missions=days.filter(d=>d.mission).length;

 const incomeActions=state.sideIncome.length;
 const responsibilityCount=Object.values(state.responsibility)
  .reduce((n,x)=>n+Object.values(x||{}).filter(Boolean).length,0);

 const presenceCount=Object.values(state.presence)
  .reduce((n,x)=>n+Object.values(x||{}).filter(Boolean).length,0);

 const codeTotal=days.reduce(
  (n,d)=>n+dailyCodeCount(d.date),0
 );

 return {
  COURAGE:Math.min(100,35+missions*3),
  DISCIPLINE:Math.min(100,35+active*2+codeTotal),
  RESPONSIBILITY:Math.min(100,35+responsibilityCount*3),
  RESPECT:Math.min(100,40+presenceCount*3),
  PRESENCE:Math.min(100,35+presenceCount*3),
  LOVE:Math.min(100,40+codeTotal),
  WEALTH:Math.min(100,35+incomeActions*2),
  BODY:Math.min(100,35+workouts*3)
 };
}

/* =========================================================
   MODAL
   ========================================================= */

function openModal(html){
 const backdrop=document.getElementById("modalBackdrop");
 const modal=document.getElementById("modal");

 modal.innerHTML=html;
 backdrop.classList.add("open");
}

function closeModal(){
 document.getElementById("modalBackdrop")
  .classList.remove("open");
}

document.getElementById("modalBackdrop").addEventListener("click",e=>{
 if(e.target.id==="modalBackdrop"){
  closeModal();
 }
});

/* =========================================================
   TOAST
   ========================================================= */

let toastTimer;

function toast(message){
 const el=document.getElementById("toast");

 el.textContent=message;
 el.classList.add("show");

 clearTimeout(toastTimer);

 toastTimer=setTimeout(()=>{
  el.classList.remove("show");
 },1800);
}

/* =========================================================
   RESET
   ========================================================= */

function resetApp(){
 if(!confirm(
  "RESURGIRの全データを削除します。\n本当に実行しますか？"
 ))return;

 localStorage.removeItem(KEY);
 localStorage.removeItem(OLD_KEY);

 state=defaultState();
 currentScreen="HOME";

 render();
 toast("SYSTEM RESET");
}

/* =========================================================
   ESCAPE
   ========================================================= */

function esc(value){
 return String(value??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

function escAttr(value){
 return esc(value);
}

/* =========================================================
   START
   ========================================================= */

render();
